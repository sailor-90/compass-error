<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compass Error TITANIA</title>
<meta name="theme-color" content="#0b6e8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compass Err">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Layout: mobile = one view at a time + bottom tab bar; desktop = input left, result views right */
:root{
  --bg:#e9f0f3; --bg2:#dbe8ee; --panel:#ffffff; --ink:#122029; --muted:#586a77; --line:#d6dfe5;
  --accent:#0b6e8a; --accent2:#13a3b8; --accent-ink:#ffffff; --field:#f3f7f9;
  --ok:#1d7a46; --ok-bg:#e1f4ea; --warn:#955c00; --warn-bg:#fdf0d4; --bad:#b3261e; --bad-bg:#fbe3e0;
  --shadow:0 1px 2px rgba(18,32,41,.06),0 8px 24px rgba(18,32,41,.07);
  --r:16px;
  --f-display:"Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1218; --bg2:#102029; --panel:#141f27; --ink:#e3ebf0; --muted:#93a4b0; --line:#25343e;
  --accent:#4cb6d4; --accent2:#2f8fb0; --accent-ink:#06222b; --field:#0f1920;
  --ok:#6fd39a; --ok-bg:#12301f; --warn:#f0c065; --warn-bg:#33270c; --bad:#ff8f86; --bad-bg:#3a1513;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1218; --bg2:#102029; --panel:#141f27; --ink:#e3ebf0; --muted:#93a4b0; --line:#25343e;
  --accent:#4cb6d4; --accent2:#2f8fb0; --accent-ink:#06222b; --field:#0f1920;
  --ok:#6fd39a; --ok-bg:#12301f; --warn:#f0c065; --warn-bg:#33270c; --bad:#ff8f86; --bad-bg:#3a1513;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:linear-gradient(180deg,var(--bg2),var(--bg) 280px);background-repeat:no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:16px calc(64px + env(safe-area-inset-bottom,0px))}

/* hero = live dashboard (compact) */
.hero{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;margin-bottom:14px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#0b6e8a,#13a3b8);box-shadow:var(--shadow)}
.hero-top{display:flex;align-items:center;gap:8px}
.hero-top svg{flex:none;width:22px;height:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:1rem;letter-spacing:.01em;margin:0;line-height:1.15}
.sub{display:none}
.hero .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hero .kpi{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:5px 6px}
.hero .kpi::before{display:none}
.hero .kpi .k{font-size:.58rem;letter-spacing:.05em;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .kpi .v{font-size:.82rem;margin-top:1px;white-space:nowrap}
.hero .kpi .n{display:none}
.hero .kpi.main{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;padding:6px 10px}
.hero .kpi.main .k{flex:none}
.hero .kpi.main .v{font-size:1.5rem;margin:0;letter-spacing:.02em}
.hero .kpi.main .n{display:block;color:rgba(255,255,255,.85);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (min-width:700px){.hero .kpis{grid-template-columns:1.6fr repeat(4,minmax(0,1fr))}.hero .kpi.main{grid-column:auto;display:block}.hero .kpi.main .n{margin-top:1px}.hero .kpi .v{font-size:1.05rem}}

/* dashboard only on the Input tab (phone); always visible on wide screens where Input is always shown */
@media (max-width:899px){body:not([data-v="input"]) .hero{display:none}}

/* intro splash */
#intro{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(160deg,#0a4f64,#0b6e8a 55%,#13a3b8);color:#fff;transition:opacity .55s ease,visibility .55s}
#intro.out{opacity:0;visibility:hidden}
#intro svg{width:132px;height:132px;overflow:visible}
#intro .ring{stroke-dasharray:132;stroke-dashoffset:132;animation:ring .9s ease-out .1s forwards}
#intro .ticks{opacity:0;animation:fade .4s ease .7s forwards}
#intro .needle{transform-origin:24px 24px;animation:swing 1.3s cubic-bezier(.2,.8,.3,1) .25s both}
#intro .t1{font-family:var(--f-display);font-weight:700;font-size:1.9rem;letter-spacing:.04em;opacity:0;transform:translateY(8px);animation:rise .6s ease .9s forwards}
#intro .t2{font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;opacity:0;animation:rise .6s ease 1.1s forwards;margin-top:-10px}
@keyframes ring{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes swing{0%{transform:rotate(-380deg)}55%{transform:rotate(14deg)}75%{transform:rotate(-6deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion: reduce){#intro{display:none}}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.views{display:flex;flex-direction:column;gap:16px}
.views>[data-view]{display:none;min-width:0}
body[data-v="input"] .views>[data-view="input"],
body[data-v="summary"] .views>[data-view="summary"],
body[data-v="book"] .views>[data-view="book"],
body[data-v="working"] .views>[data-view="working"]{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent2))}
h3{font-family:var(--f-display);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:4px 0 8px}
.grp{display:flex;flex-direction:column;gap:12px}
.grp+.grp{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}

/* form */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
input,select{font:inherit;font-family:var(--f-data);font-size:.95rem;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%;min-width:0;min-height:44px}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.pos{display:grid;grid-template-columns:56px 1fr 66px;gap:8px}
.trow{display:flex;gap:8px;align-items:stretch}
.trow input{flex:1}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:0 12px;font-size:.82rem;min-height:42px}
button{font:inherit;font-family:var(--f-display);font-weight:700;font-size:.92rem;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--field);color:var(--ink);min-height:42px}
button.on,button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.cta{width:100%;margin-top:18px;min-height:48px;font-size:1rem}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
details{border-top:1px dashed var(--line);margin-top:18px;padding-top:14px}
summary{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:.88rem;color:var(--accent)}
.card8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}

/* results */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{border-radius:14px;padding:14px;background:var(--field);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--accent),var(--accent2))}
.kpi .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-display);font-weight:600}
.kpi .v{font-family:var(--f-data);font-size:1.45rem;font-weight:700;margin-top:4px}
.kpi .n{font-size:.74rem;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:flex;gap:12px;align-items:flex-start;font-size:.9rem;padding:11px 12px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.pill{flex:none;font-family:var(--f-display);font-weight:700;font-size:.7rem;letter-spacing:.07em;padding:3px 9px;border-radius:99px;margin-top:1px}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)} .p-bad{background:var(--bad-bg);color:var(--bad)}

/* book */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.row h2{margin:0}
.scroll{overflow-x:auto;border-radius:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.book th,.book td{border:1px solid var(--line);padding:8px 7px;text-align:center;font-size:.82rem}
.book th{font-family:var(--f-display);font-weight:700;background:var(--field);color:var(--muted)}
.book td{font-family:var(--f-data);font-size:.88rem;white-space:nowrap;font-weight:600}
.book td.rm{white-space:normal;text-align:left;font-family:var(--f-body);font-weight:400;min-width:220px}
.book .cap{font-family:var(--f-display);letter-spacing:.1em;font-size:.76rem;color:var(--accent);background:var(--field)}
.blank{color:var(--muted)}
.calc{font-family:var(--f-data);font-size:.82rem;color:var(--ink);line-height:1.8;white-space:pre-wrap;margin:0;overflow-x:auto}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;gap:0;padding:0 0 calc(env(safe-area-inset-bottom,0px)*.45);background:var(--panel);border-top:1px solid var(--line)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:transparent;color:var(--muted);padding:5px 0 4px;border-radius:0;font-size:11px;letter-spacing:.02em;min-height:0;position:relative}
.tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{background:none;color:var(--accent)}
.dot{position:absolute;top:3px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;border:2px solid var(--panel);display:none}
.dot.ok{display:block;background:var(--ok)} .dot.warn{display:block;background:#e0a21c} .dot.bad{display:block;background:var(--bad)}

@media (min-width:900px){
  .views{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
  .views>[data-view="input"]{display:block!important;grid-column:1;grid-row:1}
  .views>[data-view]:not([data-view="input"]){grid-column:2;grid-row:1}
  body[data-v="input"] .views>[data-view="summary"]{display:flex;flex-direction:column;gap:16px}
  .tabbar [data-v="input"]{display:none}
  .cta{display:none}
}
@media (max-width:420px){.card8{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="intro" aria-hidden="true">
  <svg viewBox="0 0 48 48"><circle class="ring" cx="24" cy="24" r="21" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" transform="rotate(-90 24 24)"/><g class="ticks" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M24 5v3M24 40v3M5 24h3M40 24h3"/></g><g class="needle"><path d="M24 9l5 15H19z" fill="#ffb347"/><path d="M24 39l-5-15h10z" fill="#fff"/></g><circle cx="24" cy="24" r="2.2" fill="#0b6e8a"/></svg>
  <div class="t1">Compass Error</div>
  <div class="t2">MT TITANIA</div>
</div>

<div class="wrap">
<header class="hero">
  <div class="hero-top">
    <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="#fff" stroke-width="3"/><path d="M24 7l6 17H18z" fill="#ffb347"/><path d="M24 41l-6-17h12z" fill="#fff"/><circle cx="24" cy="24" r="2.6" fill="#0b6e8a"/></svg>
    <div>
      <h1>Compass Error · MT TITANIA</h1>
      <div class="sub">Live summary · updates as you type</div>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
</header>

<main class="views">
  <!-- INPUT -->
  <form class="card" id="f" data-view="input" autocomplete="off">
    <h2>Observation</h2>
    <div class="grp">
      <h3>Time &amp; position</h3>
      <div class="fields">
        <label>Date<input type="date" id="date" value="2026-10-05"></label>
        <label>Time<span class="trow"><input type="time" id="time" value="10:58"><span class="seg" role="group" aria-label="Time zone"><button type="button" id="tzLocal" class="on" title="Local time UTC+8">LT</button><button type="button" id="tzUtc" title="Universal time">UTC</button></span></span></label>
        <label class="full">Latitude
          <span class="pos"><input id="latD" type="number" min="0" max="89" value="1" aria-label="Lat degrees"><input id="latM" type="number" step="0.001" min="0" max="59.999" value="17.783" aria-label="Lat minutes"><select id="latH" aria-label="N/S"><option>N</option><option>S</option></select></span>
        </label>
        <label class="full">Longitude
          <span class="pos"><input id="lonD" type="number" min="0" max="179" value="103" aria-label="Long degrees"><input id="lonM" type="number" step="0.001" min="0" max="59.999" value="57.028" aria-label="Long minutes"><select id="lonH" aria-label="E/W"><option>E</option><option>W</option></select></span>
        </label>
      </div>
    </div>

    <div class="grp">
      <h3>Headings</h3>
      <div class="fields">
        <label>Gyro heading (°)<input id="gHdg" type="number" step="0.1" value="91.3"></label>
        <label>Magnetic heading (°)<input id="mHdg" type="number" step="0.1" value="95.2"></label>
        <label class="full">Steering compass heading (°) <span class="hint">optional</span><input id="sHdg" type="number" step="0.1" placeholder="leave blank if not read"></label>
      </div>
    </div>

    <div class="grp">
      <h3>Object &amp; bearing</h3>
      <div class="fields">
        <label class="full">Object observed<select id="obj"></select></label>
        <div class="full fields" id="customBox" hidden>
          <label>Object lat (decimal °)<input id="cLat" type="number" step="0.00001" placeholder="1.30907"></label>
          <label>Object long (decimal °)<input id="cLon" type="number" step="0.00001" placeholder="103.93272"></label>
          <label class="full">Object name<input id="cName" type="text" placeholder="name on chart"></label>
        </div>
        <label class="full">Obs. gyro bearing to object (°)<input id="obs" type="number" step="0.1" placeholder="read from azimuth circle"></label>
      </div>
    </div>

    <details>
      <summary>Variation &amp; deviation card settings</summary>
      <div class="fields" style="margin-top:12px">
        <label>Chart variation (°, + = E)<input id="varBase" type="number" step="0.1" value="0.2"></label>
        <label>Reference year<input id="varYear" type="number" value="2020"></label>
        <label class="full">Annual change (minutes, + = towards E)<input id="varAnn" type="number" step="0.5" value="-2"></label>
      </div>
      <p class="hint" style="margin:14px 0 0">Deviation card 18-09-26 (+ = E, − = W), linearly interpolated:</p>
      <div class="card8" id="cardBox"></div>
    </details>

    <button type="button" class="primary cta" id="toResult">View checks →</button>
  </form>

  <!-- SUMMARY -->
  <section data-view="summary">
    <div class="card">
      <h2>Checks</h2>
      <ul class="checks" id="checks"></ul>
    </div>
  </section>

  <!-- BOOK -->
  <section data-view="book">
    <div class="card">
      <div class="row">
        <h2>Book entry</h2>
        <button type="button" class="primary" id="copyBtn">Copy row</button>
      </div>
      <div class="scroll">
        <table class="book" id="bookMag"></table>
      </div>
      <div class="scroll" style="margin-top:14px">
        <table class="book" id="bookGyro"></table>
      </div>
      <textarea id="copySrc" class="hint" style="margin-top:10px;width:100%;font-family:var(--f-data);background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:10px" rows="2" readonly hidden></textarea>
    </div>
  </section>

  <!-- WORKING -->
  <section data-view="working">
    <div class="card">
      <h2>Working</h2>
      <pre class="calc" id="steps"></pre>
    </div>
  </section>
</main>
</div>

<nav class="tabbar" aria-label="Sections">
  <button type="button" data-v="input"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>Input</button>
  <button type="button" data-v="summary"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Checks<span class="dot" id="dot"></span></button>
  <button type="button" data-v="book"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M5 17a3 3 0 013-3h11"/></svg>Book</button>
  <button type="button" data-v="working"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Working</button>
</nav>

const CARD_HDG=[0,45,90,135,180,225,270,315];
const CARD_DEV=[-1,1,-1,1,1,-1,1,-1];
const $=id=>document.getElementById(id);
let tz="local";

// populate selects
const objSel=$("obj");
let lastKey="";
// Rebuild the object list sorted by distance from the ship; keeps the current choice.
function rebuildList(lat,lon){
  const key=lat===null||lon===null?"none":lat.toFixed(3)+","+lon.toFixed(3);
  if(key===lastKey)return; lastKey=key;
  const cur=objSel.value; objSel.innerHTML="";
  const withD=OBJECTS.map(o=>({...o,nm:(lat===null||lon===null)?null:inv(lat,lon,o.lat,o.lon).d/1852}));
  const groups=[["Recommended (1–6 NM)",x=>x.nm>=1&&x.nm<=6],["Too close (under 1 NM)",x=>x.nm<1],["Farther (6–12 NM)",x=>x.nm>6&&x.nm<=12]];
  if(lat===null||lon===null){withD.sort((a,b)=>a.name.localeCompare(b.name));withD.forEach(o=>objSel.add(new Option(o.name,o.id)));}
  else{
    withD.sort((a,b)=>a.nm-b.nm);
    groups.forEach(([label,f])=>{const items=withD.filter(f);if(!items.length)return;
      const og=document.createElement("optgroup");og.label=label;
      items.forEach(o=>og.appendChild(new Option(`${o.name} · ${o.nm.toFixed(1)} NM · ${o.g}`,o.id)));objSel.appendChild(og);});
  }
  objSel.add(new Option("Other object (enter coordinates)","custom"));
  const ids=[...objSel.options].map(o=>o.value);
  if(ids.includes(cur))objSel.value=cur;
  else{const best=withD.filter(x=>x.nm!==null&&x.nm>=1&&x.nm<=6).sort((a,b)=>(a.g>b.g)-(a.g<b.g)||a.nm-b.nm)[0];
    objSel.value=best?best.id:objSel.options[0].value;}
}
const cardBox=$("cardBox");
CARD_HDG.forEach((h,i)=>{const l=document.createElement("label");l.textContent=String(h).padStart(3,"0")+"°";
  const inp=document.createElement("input");inp.type="number";inp.step="0.1";inp.value=CARD_DEV[i];inp.id="cd"+h;l.appendChild(inp);cardBox.appendChild(l)});

const n=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
const norm=a=>((a%360)+360)%360;
const sdiff=a=>{let d=norm(a);return d>180?d-360:d}; // signed -180..180
const f3=a=>norm(a).toFixed(1).padStart(5,"0");
const ew=v=>Math.abs(v)<0.05?"0.0°":Math.abs(v).toFixed(1)+"°"+(v>0?"E":"W");
const hl=v=>Math.abs(v)<0.05?"0.0°":Math.abs(v).toFixed(1)+"° "+(v>0?"Low":"High");

// Vincenty inverse, WGS84
function inv(lat1,lon1,lat2,lon2){
  const a=6378137,f=1/298.257223563,b=a*(1-f),r=Math.PI/180;
  const L=(lon2-lon1)*r,U1=Math.atan((1-f)*Math.tan(lat1*r)),U2=Math.atan((1-f)*Math.tan(lat2*r));
  const sU1=Math.sin(U1),cU1=Math.cos(U1),sU2=Math.sin(U2),cU2=Math.cos(U2);
  let lam=L,lp,sS,cS,sig,sA,c2A,c2Sm,i=0;
  do{const sL=Math.sin(lam),cL=Math.cos(lam);
    sS=Math.hypot(cU2*sL,cU1*sU2-sU1*cU2*cL); if(sS===0)return{d:0,az:0};
    cS=sU1*sU2+cU1*cU2*cL; sig=Math.atan2(sS,cS); sA=cU1*cU2*sL/sS; c2A=1-sA*sA;
    c2Sm=c2A?cS-2*sU1*sU2/c2A:0; const C=f/16*c2A*(4+f*(4-3*c2A));
    lp=lam; lam=L+(1-C)*f*sA*(sig+C*sS*(c2Sm+C*cS*(-1+2*c2Sm*c2Sm)));
  }while(Math.abs(lam-lp)>1e-12&&++i<200);
  const u2=c2A*(a*a-b*b)/(b*b),A=1+u2/16384*(4096+u2*(-768+u2*(320-175*u2))),B=u2/1024*(256+u2*(-128+u2*(74-47*u2)));
  const dS=B*sS*(c2Sm+B/4*(cS*(-1+2*c2Sm*c2Sm)-B/6*c2Sm*(-3+4*sS*sS)*(-3+4*c2Sm*c2Sm)));
  const az=Math.atan2(cU2*Math.sin(lam),cU1*sU2-sU1*cU2*Math.cos(lam))/r;
  return{d:b*A*(sig-dS),az:norm(az)};
}
function cardDev(h){
  const dev=CARD_HDG.map(x=>n($("cd"+x).value)??0);
  h=norm(h);const i=Math.floor(h/45)%8,j=(i+1)%8,t=(h-i*45)/45;
  return dev[i]+(dev[j]-dev[i])*t;
}
function pill(cls,txt){return `<span class="pill ${cls}">${txt}</span>`}

function calc(){
  const date=$("date").value,time=$("time").value;
  const latD=n($("latD").value),latM=n($("latM").value),lonD=n($("lonD").value),lonM=n($("lonM").value);
  const gH=n($("gHdg").value),mH=n($("mHdg").value),sH=n($("sHdg").value),obs=n($("obs").value);
  const lat=(latD!==null&&latM!==null)?(latD+latM/60)*($("latH").value==="S"?-1:1):null;
  const lon=(lonD!==null&&lonM!==null)?(lonD+lonM/60)*($("lonH").value==="W"?-1:1):null;

  // UTC
  let utcDate="—",gmt="—",dt=null;
  if(date&&time){const [Y,M,D]=date.split("-").map(Number),[h,mi]=time.split(":").map(Number);
    dt=new Date(Date.UTC(Y,M-1,D,h,mi)-(tz==="local"?8*3600e3:0));
    utcDate=`${String(dt.getUTCDate()).padStart(2,"0")}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCFullYear()).slice(2)}`;
    gmt=String(dt.getUTCHours()).padStart(2,"0")+String(dt.getUTCMinutes()).padStart(2,"0");}

  // variation
  const vb=n($("varBase").value)??0,vy=n($("varYear").value)??2020,va=n($("varAnn").value)??0;
  const yrs=dt?(dt.getUTCFullYear()+(dt-Date.UTC(dt.getUTCFullYear(),0,1))/(365.25*864e5))-vy:0;
  const variation=vb+yrs*va/60;

  rebuildList(lat,lon);
  const isCustom=objSel.value==="custom"; $("customBox").hidden=!isCustom;
  let obj=OBJECTS.find(o=>o.id===objSel.value);
  if(isCustom){const la=n($("cLat").value),lo=n($("cLon").value);obj=(la!==null&&lo!==null)?{name:$("cName").value||"Other object",lat:la,lon:lo}:null}

  // core
  let tb=null,dist=null;
  if(obj&&lat!==null&&lon!==null){const r=inv(lat,lon,obj.lat,obj.lon);tb=r.az;dist=r.d/1852}
  const gErr=(tb!==null&&obs!==null)?sdiff(tb-obs):null;            // + = Low
  const magObs=(obs!==null&&gH!==null&&mH!==null)?norm(obs+sdiff(mH-gH)):null;
  const cErr=(tb!==null&&magObs!==null)?sdiff(tb-magObs):null;       // + = E
  const dev=cErr!==null?cErr-variation:null;
  const cDev=mH!==null?cardDev(mH):null;
  const dDiff=(dev!==null&&cDev!==null)?dev-cDev:null;
  const steerDiff=(sH!==null&&mH!==null)?sdiff(sH-mH):null;
  const B=v=>v===null?'<span class="blank">—</span>':v;

  // KPIs
  $("kpis").innerHTML=[
    ["True bearing",tb===null?"—":f3(tb)+"°",obj?(dist!==null?dist.toFixed(2)+" NM · ":"")+obj.name:"Select an object"],
    ["Gyro err",gErr===null?"—":hl(gErr),"True − Obs gyro"],
    ["Comp. err",cErr===null?"—":ew(cErr),"True − Obs magnetic"],
    ["Deviation",dev===null?"—":ew(dev),"Err − Var"],
    ["Card dev",cDev===null?"—":ew(cDev),mH===null?"":"heading "+f3(mH)+"°"],
  ].map((k,i)=>`<div class="kpi${i?"":" main"}"><div class="k">${k[0]}</div><div class="v">${k[1]}</div><div class="n">${k[2]}</div></div>`).join("");

  // remarks
  const rm=[];
  if(obj)rm.push(`Brg ${obj.name}${dist!==null?" "+dist.toFixed(2)+" NM":""}.`);
  if(dDiff!==null&&Math.abs(dDiff)>2)rm.push(`Dev ${ew(dev)} vs card ${ew(cDev)}, to be verified.`);
  if(gErr!==null&&Math.abs(gErr)>1)rm.push(`Gyro error exceeds 1°, reported.`);
  const remarks=rm.join(" ");

  const fmtLat=lat===null?null:`${String(Math.floor(Math.abs(lat))).padStart(2,"0")}°${((Math.abs(lat)%1)*60).toFixed(1).padStart(4,"0")}'${lat<0?"S":"N"}`;
  const fmtLon=lon===null?null:`${String(Math.floor(Math.abs(lon))).padStart(3,"0")}°${((Math.abs(lon)%1)*60).toFixed(1).padStart(4,"0")}'${lon<0?"W":"E"}`;
  const mag=[utcDate,gmt,fmtLat,fmtLon,mH===null?null:f3(mH)+"°",sH===null?null:f3(sH)+"°",magObs===null?null:f3(magObs)+"°",tb===null?null:f3(tb)+"°",cErr===null?null:ew(cErr),ew(variation),dev===null?null:ew(dev)];
  const gyr=[gH===null?null:f3(gH)+"°",obs===null?null:f3(obs)+"°",tb===null?null:f3(tb)+"°",gErr===null?null:hl(gErr),null,remarks||null];

  $("bookMag").innerHTML=`<tr><th colspan="11" class="cap">MAGNETIC COMPASS</th></tr>
   <tr><th rowspan="2">Date</th><th rowspan="2">Gmt.</th><th rowspan="2">Lat.</th><th rowspan="2">Long.</th><th colspan="2">Ship's Head By</th><th rowspan="2">Obs.<br>Brg.</th><th rowspan="2">True<br>Brg.</th><th rowspan="2">Err.</th><th rowspan="2">Var.</th><th rowspan="2">Dev.</th></tr>
   <tr><th>Stand.</th><th>Steer.</th></tr><tr>${mag.map(B).map(v=>`<td>${v}</td>`).join("")}</tr>`;
  $("bookGyro").innerHTML=`<tr><th colspan="5" class="cap">GYRO COMPASS</th><th rowspan="2">REMARKS</th></tr>
   <tr><th>Ship's<br>Head</th><th>Obs.<br>Brg.</th><th>True<br>Brg.</th><th>Error</th><th>Observer<br>Rank/Sign</th></tr>
   <tr>${gyr.map(B).map((v,i)=>`<td class="${i===5?"rm":""}">${v}</td>`).join("")}</tr>`;
  $("copySrc").value=[...mag,...gyr].map(v=>v??"").join("\t");

  // checks
  const ch=[];
  if(dist!==null)ch.push(dist<1?[pill("p-warn","CAUTION"),`Object only ${dist.toFixed(2)} NM away. Result less reliable; use an object beyond 1 NM where possible.`]:[pill("p-ok","OK"),`Object distance ${dist.toFixed(2)} NM.`]);
  if(gErr!==null)ch.push(Math.abs(gErr)>1?[pill("p-bad","REPORT"),`Gyro error ${hl(gErr)} exceeds 1°. Repeat the bearing; if it persists, report to the Master.`]:[pill("p-ok","OK"),`Gyro error ${hl(gErr)} within normal limits.`]);
  if(dDiff!==null){const a=Math.abs(dDiff);
    ch.push(a>2?[pill("p-bad","CHECK"),`Deviation ${ew(dev)} differs ${a.toFixed(1)}° from card (${ew(cDev)}). Re-read the standard compass bowl; report to the Master if it persists.`]
      :a>1?[pill("p-warn","MONITOR"),`Deviation differs ${a.toFixed(1)}° from card. Acceptable; monitor the trend.`]
      :[pill("p-ok","OK"),`Deviation agrees with card (difference ${a.toFixed(1)}°).`]);}
  if(gH!==null){const tH=gH+(gErr??0);let c=tH-variation;for(let k=0;k<4;k++)c=tH-variation-cardDev(c);
    ch.push([pill("p-ok","GUIDE"),`Expected magnetic heading from card ≈ ${f3(c)}°${mH!==null?` (read ${f3(mH)}°)`:""}. Use only to catch a misread; always record the value actually read.`]);}
  if(steerDiff!==null)ch.push(Math.abs(steerDiff)>2?[pill("p-warn","CHECK"),`Steering compass differs ${Math.abs(steerDiff).toFixed(1)}° from standard.`]:[pill("p-ok","OK"),`Steering compass agrees with standard (difference ${Math.abs(steerDiff).toFixed(1)}°).`]);
  else ch.push([pill("p-warn","BLANK"),"Steering compass not entered. Steer. column stays blank; do not fill in an estimate."]);
  $("checks").innerHTML=ch.map(c=>`<li>${c[0]}<span>${c[1]}</span></li>`).join("");

  // steps
  const s=[];
  s.push(`GMT          = ${time||"—"} ${tz==="local"?"− 8 h":"(UTC)"} = ${gmt}`);
  if(tb!==null)s.push(`True Brg     = WGS84 from ship to ${obj.name} = ${f3(tb)}°`);
  if(gErr!==null)s.push(`Gyro Error   = True − Obs = ${f3(tb)} − ${f3(obs)} = ${hl(gErr)}`);
  if(magObs!==null)s.push(`Obs Brg mag  = Obs gyro + (Mag Hdg − Gyro Hdg) = ${f3(obs)} + (${f3(mH)} − ${f3(gH)}) = ${f3(magObs)}°`);
  if(cErr!==null)s.push(`Compass Err  = True − Obs mag = ${f3(tb)} − ${f3(magObs)} = ${ew(cErr)}`);
  s.push(`Variation    = ${vb.toFixed(1)}° + ${yrs.toFixed(2)} yr × (${va}') = ${ew(variation)}`);
  if(dev!==null)s.push(`Deviation    = Err − Var = ${ew(dev)}   (card: ${ew(cDev)})`);
  $("steps").textContent=s.join("\n");
}
